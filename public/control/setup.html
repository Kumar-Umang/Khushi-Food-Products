<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMVIKA FOODS — Initial Setup</title><style>body{font-family:Arial;background:#f5f5f5;margin:0;min-height:100vh;display:grid;place-items:center}.box{background:#fff;padding:28px;border-radius:12px;width:min(420px,92vw);box-shadow:0 8px 30px #0001}.field{display:grid;gap:6px;margin:12px 0}input{padding:10px;border:1px solid #ccc;border-radius:7px;font:inherit}button{background:#1d5517;color:#fff;border:0;padding:11px 16px;border-radius:7px;font-weight:700}.err{color:#b21d18;margin:10px 0}.ok{color:#176c18;margin:10px 0}</style></head><body><div class="box"><h2>Initial Administrator Setup</h2><p>Create the administrator username and password for the first time.</p><div class="field"><label>Username</label><input id="u" autocomplete="username"></div><div class="field"><label>Password (minimum 8 characters)</label><input id="p" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input id="c" type="password" autocomplete="new-password"></div><div class="field"><label>One-time setup token</label><input id="t" type="password" autocomplete="off"></div><div id="m"></div><button onclick="go()">Create Administrator</button></div><script>async function go(){let u=document.getElementById('u').value.trim(),p=document.getElementById('p').value,c=document.getElementById('c').value,m=document.getElementById('m');m.className='';m.textContent='';if(p!==c)return m.className='err',m.textContent='Passwords do not match';try{let r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,setupToken:document.getElementById('t').value})}),x=await r.json();if(!r.ok)throw Error(x.error||'Setup failed');m.className='ok';m.textContent='Administrator created. Redirecting…';setTimeout(()=>location.href='/',700)}catch(e){m.className='err';m.textContent=e.message}}</script></div></body></html>
